openapi: 3.1.0
info:
  title: ForwardMeasure OpenWorkflow Execution API
  version: 1.0.0
paths:
  /api/v1/executions:
    post:
      tags: [Executions]
      operationId: startExecution
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionStart'}
      responses:
        '202':
          description: Execution durably admitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
    get:
      tags: [Executions]
      operationId: listExecutions
      parameters:
        - {name: state, in: query, schema: {type: array, items: {$ref: '#/components/schemas/ExecutionState'}}}
        - {name: engineId, in: query, schema: {type: string}}
        - {name: correlationId, in: query, schema: {type: string}}
        - {name: createdFrom, in: query, schema: {type: string, format: date-time}}
        - {name: createdUntil, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Canonical execution page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionPage'}
  /api/v1/executions/{executionId}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: getExecution
      responses:
        '200':
          description: Canonical execution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
        '404': {description: Execution not found}
  /api/v1/executions/{executionId}/history:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
      - {name: afterSequence, in: query, schema: {type: integer, format: int64, minimum: -1, default: -1}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
    get:
      tags: [Executions]
      operationId: getExecutionHistory
      responses:
        '200':
          description: Ordered canonical history
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ExecutionHistoryEntry'}}
  /api/v1/executions/{executionId}/{operation}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
      - {name: operation, in: path, required: true, schema: {type: string, enum: [pause, resume, cancel]}}
      - $ref: '#/components/parameters/CorrelationId'
      - {name: If-Match, in: header, required: true, schema: {type: integer, format: int64, minimum: 0}}
    post:
      tags: [Executions]
      operationId: controlExecution
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionControl'}
      responses:
        '202':
          description: Command transition is durable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
        '409': {description: Stale optimistic version}
components:
  parameters:
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
  schemas:
    ExecutionState:
      type: string
      enum: [NEW, RUNNING, WAITING, PAUSING, PAUSED, CANCELLING, CANCELLED, COMPLETED, FAILED]
    ExecutionStart:
      type: object
      required: [revisionId, input]
      properties:
        revisionId: {type: string, format: uuid}
        input: {}
    ExecutionControl:
      type: object
      properties:
        reason: {type: string, maxLength: 1000}
    Execution:
      type: object
      required: [id, revisionId, revisionDigest, engineId, state, version, correlationId, input, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        revisionId: {type: string, format: uuid}
        revisionDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
        engineId: {type: string}
        state: {$ref: '#/components/schemas/ExecutionState'}
        version: {type: integer, format: int64, minimum: 0}
        correlationId: {type: string}
        input: {}
        output: {}
        error: {}
        effects: {type: array, items: {}}
        timers: {type: array, items: {}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    ExecutionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Execution'}}
        nextCursor: {type: string}
    ExecutionHistoryEntry:
      type: object
      required: [eventId, sequence, state, type, occurredAt, data]
      properties:
        eventId: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 0}
        state: {$ref: '#/components/schemas/ExecutionState'}
        type: {type: string}
        taskPath: {type: string}
        occurredAt: {type: string, format: date-time}
        data: {}
