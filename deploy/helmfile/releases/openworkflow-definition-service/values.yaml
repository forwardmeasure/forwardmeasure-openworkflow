framework: quarkus
replicas: 1
image:
  repository: forwardmeasure/openworkflow-definition-quarkus
  tag: 1.0.0-SNAPSHOT
  pullPolicy: IfNotPresent
database:
  url: jdbc:postgresql://postgresql:5432/openworkflow
  username: openworkflow
keycloak:
  issuer: http://keycloak:8080/realms/openworkflow
credentialsSecretName: openworkflow-foundation
kafka:
  bootstrapServers: redpanda:9092
  applicationId: openworkflow-k3b
  topicPrefix: openworkflow-k3b
definitionResources:
  allowedHosts: ""
operations:
  httpEgressAllowlist: ""
serviceAccount:
  create: true
  name: ""
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {cpu: "2", memory: 1Gi}
terminationGracePeriodSeconds: 60
disruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: false
  extraEgress: []
telemetry:
  serviceName: ""
  otlpEndpoint: ""
  resourceAttributes: "service.namespace=forwardmeasure-openworkflow"
  injectJava: false
  protocol: grpc
  propagators: tracecontext,baggage
  tracesExporter: otlp
  metricsExporter: otlp
  logsExporter: otlp
