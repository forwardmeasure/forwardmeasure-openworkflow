apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {app: {{ .Values.name }}, engine: pekko}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: {app: {{ .Values.name }}}
  template:
    metadata:
      labels: {app: {{ .Values.name }}, engine: pekko}
      {{- if .Values.telemetry.injectJava }}
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
      {{- end }}
    spec:
      serviceAccountName: {{ default .Values.name .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: {{ .Values.name }}}
      containers:
        - name: runtime
          image: {{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 10"]}
          env:
            - {name: OPENWORKFLOW_DATABASE_URL, value: {{ .Values.database.url | quote }}}
            - {name: OPENWORKFLOW_DATABASE_USERNAME, value: {{ .Values.database.username | quote }}}
            - {name: OPENWORKFLOW_DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.credentialsSecretName }}, key: KC_DB_PASSWORD}}}
            - {name: OPENWORKFLOW_KEYCLOAK_ISSUER, value: {{ .Values.keycloak.issuer | quote }}}
            - {name: OPENWORKFLOW_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.credentialsSecretName }}, key: OPENWORKFLOW_CLIENT_SECRET}}}
            - {name: OPENWORKFLOW_DEFINITION_RESOURCE_ALLOWED_HOSTS, value: {{ .Values.definitionResources.allowedHosts | quote }} }
            - {name: OPENWORKFLOW_PERSISTENCE_PROFILE, value: {{ .Values.persistence.profile | quote }}}
            - {name: OPENWORKFLOW_PERSISTENCE_ENDPOINT, value: {{ .Values.persistence.endpoint | quote }}}
            - {name: OPENWORKFLOW_PERSISTENCE_USERNAME, value: {{ .Values.persistence.username | quote }}}
            - {name: OPENWORKFLOW_PERSISTENCE_PASSWORD, value: {{ .Values.persistence.password | quote }}}
            - {name: OPENWORKFLOW_CASSANDRA_LOCAL_DATACENTER, value: {{ .Values.persistence.localDatacenter | quote }}}
            - {name: OPENWORKFLOW_CLUSTER_DISCOVERY_SERVICE, value: {{ .Values.name | quote }}}
            - {name: OPENWORKFLOW_CLUSTER_REQUIRED_CONTACT_POINTS, value: {{ .Values.cluster.requiredContactPoints | quote }}}
            - {name: OPENWORKFLOW_CLUSTER_ROLE, value: {{ .Values.cluster.role | quote }}}
            - {name: OPENWORKFLOW_ADAPTER_SECRET_DIRECTORY, value: {{ .Values.operations.secretDirectory | quote }}}
            - {name: OPENWORKFLOW_ADAPTER_HTTP_EGRESS_ALLOWLIST, value: {{ .Values.operations.httpEgressAllowlist | quote }}}
            - {name: OPENWORKFLOW_MCP_COMMAND_ALLOWLIST, value: {{ .Values.operations.mcpCommandAllowlist | quote }}}
            - {name: OPENWORKFLOW_RUN_COMMAND_ALLOWLIST, value: {{ .Values.operations.runCommandAllowlist | quote }}}
            - {name: OPENWORKFLOW_RUN_INTERPRETER_ALLOWLIST, value: {{ .Values.operations.runInterpreterAllowlist | quote }}}
            - {name: OPENWORKFLOW_RUN_IMAGE_ALLOWLIST, value: {{ .Values.operations.runImageAllowlist | quote }}}
            - {name: OTEL_SERVICE_NAME, value: {{ default .Values.name .Values.telemetry.serviceName | quote }}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ .Values.telemetry.resourceAttributes | quote }}}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: {{ .Values.telemetry.protocol | quote }}}
            - {name: OTEL_PROPAGATORS, value: {{ .Values.telemetry.propagators | quote }}}
            - {name: OTEL_TRACES_EXPORTER, value: {{ .Values.telemetry.tracesExporter | quote }}}
            - {name: OTEL_METRICS_EXPORTER, value: {{ .Values.telemetry.metricsExporter | quote }}}
            - {name: OTEL_LOGS_EXPORTER, value: {{ .Values.telemetry.logsExporter | quote }}}
            {{- if .Values.telemetry.otlpEndpoint }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }}}
            {{- end }}
            - name: OPENWORKFLOW_POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: artery, containerPort: 25520}
            - {name: management, containerPort: 8558}
          readinessProbe:
            httpGet: {path: /ready, port: management}
            initialDelaySeconds: 10
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /alive, port: management}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /alive, port: management}
            periodSeconds: 2
            failureThreshold: 90
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: {{ .Values.name }}}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: artery, port: 25520, targetPort: artery}
    - {name: management, port: 8558, targetPort: management}
