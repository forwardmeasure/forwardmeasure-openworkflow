name: openworkflow-kafka
replicas: 3
image:
  repository: forwardmeasure/openworkflow-definition-quarkus
  tag: 1.0.0-wp5b
  digest: ""
  pullPolicy: IfNotPresent
database:
  url: jdbc:postgresql://postgresql:5432/openworkflow
  username: openworkflow
keycloak:
  issuer: http://keycloak:8080/realms/openworkflow
credentialsSecretName: openworkflow-foundation
kafka:
  bootstrapServers: redpanda:9092
  applicationId: openworkflow-k3b
  topicPrefix: openworkflow-k3b
operations:
  secretDirectory: /var/run/secrets/openworkflow
  httpEgressAllowlist: ""
  protocolTimeoutMillis: 30000
  mcpCommandAllowlist: ""
  runCommandAllowlist: ""
  runInterpreterAllowlist: ""
  runImageAllowlist: ""
  runVolumeAllowlist: ""
  runPortAllowlist: ""
  ociRuntime: podman
definitionResources:
  allowedHosts: ""
serviceAccount:
  create: true
  name: ""
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {cpu: "2", memory: 1Gi}
terminationGracePeriodSeconds: 90
disruptionBudget:
  enabled: true
  minAvailable: 2
networkPolicy:
  enabled: false
  extraEgress: []
telemetry:
  serviceName: openworkflow-kafka
  otlpEndpoint: ""
  resourceAttributes: "service.namespace=forwardmeasure-openworkflow,openworkflow.engine=kafka-streams"
  injectJava: false
  protocol: grpc
  propagators: tracecontext,baggage
  tracesExporter: otlp
  metricsExporter: otlp
  logsExporter: otlp
