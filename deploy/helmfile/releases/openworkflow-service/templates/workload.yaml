apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {app.kubernetes.io/name: {{ .Values.name }}, openworkflow.io/capability: {{ .Values.capability }}, openworkflow.io/framework: {{ .Values.framework }}{{ if .Values.engine }}, openworkflow.io/engine: {{ .Values.engine }}{{ end }}}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Values.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Values.name }}, openworkflow.io/capability: {{ .Values.capability }}, openworkflow.io/framework: {{ .Values.framework }}{{ if .Values.engine }}, openworkflow.io/engine: {{ .Values.engine }}{{ end }}}
    spec:
      serviceAccountName: {{ default .Values.name .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.capability }}
          image: {{ required "image.repository is required" .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env: {{- toYaml (concat .Values.env .Values.secretEnv) | nindent 12 }}
          ports:
            - {name: http, containerPort: {{ .Values.service.port }}}
            {{- range .Values.containerPorts }}
            - {name: {{ .name }}, containerPort: {{ .containerPort }}}
            {{- end }}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 3, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata: {name: {{ .Values.name }}}
spec:
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector: {app.kubernetes.io/name: {{ .Values.name }}}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    {{- range .Values.service.extraPorts }}
    - {name: {{ .name }}, port: {{ .port }}, targetPort: {{ .targetPort }}}
    {{- end }}
{{- end }}
