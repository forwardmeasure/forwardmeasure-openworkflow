image:
  repository: forwardmeasure/openworkflow-migrations
  tag: 1.0.0-SNAPSHOT
  digest: ""
  pullPolicy: IfNotPresent

tenantIds: []

database:
  url: jdbc:postgresql://postgresql:5432/openworkflow
  username: openworkflow
  passwordSecret:
    name: openworkflow-foundation
    key: KC_DB_PASSWORD

cassandra:
  enabled: true
  contactPoints: cassandra:9042
  localDatacenter: datacenter1
  applicationKeyspace: openworkflow_application
  credentialsSecret:
    name: openworkflow-foundation
    usernameKey: OPENWORKFLOW_CASSANDRA_USERNAME
    passwordKey: OPENWORKFLOW_CASSANDRA_PASSWORD

backoffLimit: 12
activeDeadlineSeconds: 900
ttlSecondsAfterFinished: 86400

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
