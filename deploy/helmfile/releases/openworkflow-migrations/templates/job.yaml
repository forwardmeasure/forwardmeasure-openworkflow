apiVersion: batch/v1
kind: Job
metadata:
  name: openworkflow-migrations
  labels:
    app.kubernetes.io/name: openworkflow-migrations
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openworkflow-migrations
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
{{- if .Values.cloudSqlProxy.enabled }}
      initContainers:
        - name: cloud-sql-proxy
          image: {{ required "cloudSqlProxy.image.repository is required" .Values.cloudSqlProxy.image.repository }}{{ if .Values.cloudSqlProxy.image.digest }}@{{ .Values.cloudSqlProxy.image.digest }}{{ else }}:{{ .Values.cloudSqlProxy.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.cloudSqlProxy.image.pullPolicy | default "IfNotPresent" }}
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port={{ .Values.cloudSqlProxy.port }}"
            {{- if .Values.cloudSqlProxy.privateIp }}
            - "--private-ip"
            {{- end }}
            - {{ required "cloudSqlProxy.instanceConnectionName is required when cloudSqlProxy.enabled" .Values.cloudSqlProxy.instanceConnectionName | quote }}
          resources: {{- toYaml .Values.cloudSqlProxy.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
{{- end }}
      containers:
        - name: migrate
          image: {{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          env:
            - name: OPENWORKFLOW_DATABASE_URL
              value: {{ required "database.url is required" .Values.database.url | quote }}
            - name: OPENWORKFLOW_DATABASE_USERNAME
              value: {{ required "database.username is required" .Values.database.username | quote }}
            - name: OPENWORKFLOW_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.passwordSecret.name is required" .Values.database.passwordSecret.name | quote }}
                  key: {{ required "database.passwordSecret.key is required" .Values.database.passwordSecret.key | quote }}
            # Runtime credential (role: openworkflow) - only used to
            # create/rotate that role and grant it scoped privileges; the
            # primary connection above (OPENWORKFLOW_DATABASE_USERNAME/
            # _PASSWORD) is the administrator credential this Job actually
            # connects as.
            - name: OPENWORKFLOW_RUNTIME_DATABASE_USERNAME
              value: {{ required "runtimeDatabase.username is required" .Values.runtimeDatabase.username | quote }}
            - name: OPENWORKFLOW_RUNTIME_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtimeDatabase.passwordSecret.name is required" .Values.runtimeDatabase.passwordSecret.name | quote }}
                  key: {{ required "runtimeDatabase.passwordSecret.key is required" .Values.runtimeDatabase.passwordSecret.key | quote }}
            - name: OPENWORKFLOW_TENANT_IDS
              value: {{ required "at least one tenant ID is required" (join "," .Values.tenantIds) | quote }}
            {{- if .Values.additionalRuntimeDatabases }}
            # Other applications' runtime roles this Job's admin identity
            # also provisions - see values.yaml's own comment on why.
            - name: OPENWORKFLOW_ADDITIONAL_RUNTIME_DATABASES
              value: {{ join "," .Values.additionalRuntimeDatabases | quote }}
            {{- range .Values.additionalRuntimeDatabases }}
            - name: {{ printf "OPENWORKFLOW_RUNTIME_DATABASE_%s_PASSWORD" (. | upper) }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeDatabase.passwordSecret.name | quote }}
                  key: {{ printf "OPENWORKFLOW_RUNTIME_DATABASE_%s_PASSWORD" (. | upper) }}
            {{- end }}
            {{- end }}
{{- if .Values.cassandra.enabled }}
            - name: OPENWORKFLOW_CASSANDRA_CONTACT_POINTS
              value: {{ required "cassandra.contactPoints is required when Cassandra is enabled" .Values.cassandra.contactPoints | quote }}
            - name: OPENWORKFLOW_CASSANDRA_LOCAL_DATACENTER
              value: {{ required "cassandra.localDatacenter is required when Cassandra is enabled" .Values.cassandra.localDatacenter | quote }}
            - name: OPENWORKFLOW_CASSANDRA_MIGRATION_KEYSPACE
              value: {{ required "cassandra.migrationKeyspace is required when Cassandra is enabled" .Values.cassandra.migrationKeyspace | quote }}
            - name: OPENWORKFLOW_CASSANDRA_APPLICATION_KEYSPACE
              value: {{ required "cassandra.applicationKeyspace is required when Cassandra is enabled" .Values.cassandra.applicationKeyspace | quote }}
            - name: OPENWORKFLOW_CASSANDRA_REPLICATION_FACTOR
              value: {{ required "cassandra.replicationFactor is required when Cassandra is enabled" .Values.cassandra.replicationFactor | quote }}
            - name: OPENWORKFLOW_CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cassandra.credentialsSecret.name | quote }}
                  key: {{ .Values.cassandra.credentialsSecret.usernameKey | quote }}
                  optional: true
            - name: OPENWORKFLOW_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cassandra.credentialsSecret.name | quote }}
                  key: {{ .Values.cassandra.credentialsSecret.passwordKey | quote }}
                  optional: true
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
