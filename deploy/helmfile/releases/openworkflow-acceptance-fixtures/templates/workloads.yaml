{{- $fixtures := list
  (dict "name" "k7-echo" "image" .Values.images.nginx "containerPort" 80 "servicePort" 80 "portName" "http")
  (dict "name" "k7-grpcbin" "image" .Values.images.grpcbin "containerPort" 9000 "servicePort" 9000 "portName" "grpc")
  (dict "name" "k7-nats" "image" .Values.images.nats "containerPort" 4222 "servicePort" 4222 "portName" "client")
}}
{{- range $fixture := $fixtures }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fixture.name }}
  labels:
    app.kubernetes.io/name: {{ $fixture.name }}
    app.kubernetes.io/part-of: openworkflow-milestone-4-acceptance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fixture.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $fixture.name }}
        app.kubernetes.io/part-of: openworkflow-milestone-4-acceptance
    spec:
      containers:
        - name: fixture
          image: {{ $fixture.image }}
          imagePullPolicy: IfNotPresent
          {{- if eq $fixture.name "k7-nats" }}
          args: ["--http_port", "8222"]
          {{- end }}
          ports:
            - name: {{ $fixture.portName }}
              containerPort: {{ $fixture.containerPort }}
            {{- if eq $fixture.name "k7-nats" }}
            - name: monitor
              containerPort: 8222
            {{- end }}
          readinessProbe:
            {{- if eq $fixture.name "k7-nats" }}
            httpGet: {path: /healthz, port: monitor}
            {{- else }}
            tcpSocket: {port: {{ $fixture.portName }}}
            {{- end }}
            initialDelaySeconds: 1
            periodSeconds: 2
          {{- if ne $fixture.name "k7-echo" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fixture.name }}
  labels:
    app.kubernetes.io/name: {{ $fixture.name }}
    app.kubernetes.io/part-of: openworkflow-milestone-4-acceptance
spec:
  selector:
    app.kubernetes.io/name: {{ $fixture.name }}
  ports:
    - name: {{ $fixture.portName }}
      port: {{ $fixture.servicePort }}
      targetPort: {{ $fixture.portName }}
    {{- if eq $fixture.name "k7-nats" }}
    - name: monitor
      port: 8222
      targetPort: monitor
    {{- end }}
{{- end }}
