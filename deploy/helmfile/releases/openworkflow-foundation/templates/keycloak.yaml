{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:{{ .Values.versions.keycloak }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["start-dev", "--features=authzen", "--import-realm"]
          envFrom:
            - secretRef: {name: openworkflow-foundation}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://postgresql:5432/{{ .Values.database.name }}"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: realm
          configMap: {name: openworkflow-keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
