{{- if .Values.cassandra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cassandra
spec:
  selector: {app: cassandra}
  ports:
    - {name: cql, port: 9042, targetPort: cql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels: {app: cassandra}
  template:
    metadata:
      labels: {app: cassandra}
    spec:
      containers:
        - name: cassandra
          image: cassandra:{{ .Values.versions.cassandra }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: CASSANDRA_CLUSTER_NAME, value: openworkflow}
            - {name: CASSANDRA_DC, value: datacenter1}
            - {name: CASSANDRA_ENDPOINT_SNITCH, value: GossipingPropertyFileSnitch}
            - {name: MAX_HEAP_SIZE, value: 512M}
            - {name: HEAP_NEWSIZE, value: 100M}
          ports:
            - {name: cql, containerPort: 9042}
          readinessProbe:
            exec: {command: ["cqlsh", "127.0.0.1", "9042", "-e", "SELECT release_version FROM system.local"]}
            initialDelaySeconds: 20
            timeoutSeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openworkflow-cassandra-schema
data:
  schema.cql: |
{{ .Files.Get "files/cassandra-schema.cql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openworkflow-cassandra-schema-{{ .Files.Get "files/cassandra-schema.cql" | sha256sum | trunc 8 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cassandra:{{ .Values.versions.cassandra }}
          command: ["sh", "-ec"]
          args:
            - until cqlsh cassandra 9042 -e 'SELECT release_version FROM system.local'; do sleep 3; done; cqlsh cassandra 9042 -f /schema/schema.cql
          volumeMounts:
            - {name: schema, mountPath: /schema}
      volumes:
        - name: schema
          configMap: {name: openworkflow-cassandra-schema}
{{- end }}
