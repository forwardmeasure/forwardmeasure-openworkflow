{{- $tenantSpecs := list -}}
{{- range .Values.tenants -}}
{{- $tenantSpecs = append $tenantSpecs (printf "%s:%s:%s" .id .alias .displayName) -}}
{{- end }}
{{- if .Values.jobs.tenantReconciliation.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openworkflow-tenant-reconciliation
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-keycloak
          image: {{ .Values.images.curl.repository }}{{ if .Values.images.curl.digest }}@{{ .Values.images.curl.digest }}{{ else }}:{{ .Values.images.curl.tag }}{{ end }}
          command: ["sh", "-c", "until curl -fsS {{ .Values.jobs.tenantReconciliation.keycloakUrl }}/realms/master; do sleep 3; done"]
      containers:
        - name: reconcile
          image: {{ .Values.images.tenantProvisioning.repository }}{{ if .Values.images.tenantProvisioning.digest }}@{{ .Values.images.tenantProvisioning.digest }}{{ else }}:{{ .Values.images.tenantProvisioning.tag }}{{ end }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: KEYCLOAK_URL, value: {{ .Values.jobs.tenantReconciliation.keycloakUrl | quote }}}
            - {name: KEYCLOAK_REALM, value: {{ .Values.keycloak.realm | quote }}}
            - {name: KEYCLOAK_SHARED_CLIENT_ID, value: {{ .Values.keycloak.sharedClientId | quote }}}
            - {name: KEYCLOAK_ADMIN_USERNAME, valueFrom: {secretKeyRef: {name: {{ .Values.identityCredentialsSecretName }}, key: KC_BOOTSTRAP_ADMIN_USERNAME}}}
            - {name: KEYCLOAK_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.identityCredentialsSecretName }}, key: KC_BOOTSTRAP_ADMIN_PASSWORD}}}
            - {name: OPENWORKFLOW_TENANTS, value: {{ join "," $tenantSpecs | quote }}}
            - {name: FORWARDMEASURE_CAPABILITY_PACKS, value: {{ join "," .Values.capabilityPacks | quote }}}
{{- end }}
