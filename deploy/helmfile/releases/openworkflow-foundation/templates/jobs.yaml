{{- $tenantIds := list -}}
{{- $tenantSpecs := list -}}
{{- range .Values.tenants -}}
{{- $tenantIds = append $tenantIds .id -}}
{{- $tenantSpecs = append $tenantSpecs (printf "%s:%s:%s" .id .alias .displayName) -}}
{{- end }}
{{- if .Values.jobs.tenantReconciliation.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openworkflow-tenant-reconciliation
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-keycloak
          image: curlimages/curl:8.16.0
          command: ["sh", "-c", "until curl -fsS {{ .Values.jobs.tenantReconciliation.keycloakUrl }}/realms/master; do sleep 3; done"]
      containers:
        - name: reconcile
          image: forwardmeasure/openworkflow-tenant-provisioning:{{ .Values.versions.tenantProvisioning }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: KEYCLOAK_URL, value: {{ .Values.jobs.tenantReconciliation.keycloakUrl | quote }}}
            - {name: KEYCLOAK_REALM, value: {{ .Values.keycloak.realm | quote }}}
            - {name: KEYCLOAK_SHARED_CLIENT_UUID, value: {{ .Values.keycloak.sharedClientUuid | quote }}}
            - {name: KEYCLOAK_ADMIN_USERNAME, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.name }}, key: KC_BOOTSTRAP_ADMIN_USERNAME}}}
            - {name: KEYCLOAK_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.name }}, key: KC_BOOTSTRAP_ADMIN_PASSWORD}}}
            - {name: OPENWORKFLOW_TENANTS, value: {{ join "," $tenantSpecs | quote }}}
            - {name: FORWARDMEASURE_CAPABILITY_PACKS, value: {{ join "," .Values.capabilityPacks | quote }}}
{{- end }}
{{- if .Values.jobs.migrations.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openworkflow-migrations
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: forwardmeasure/openworkflow-migrations:{{ .Values.versions.migrations }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: OPENWORKFLOW_DATABASE_URL, value: {{ .Values.database.url | quote }}}
            - {name: OPENWORKFLOW_DATABASE_USERNAME, value: {{ .Values.database.username | quote }}}
            - {name: OPENWORKFLOW_DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.name }}, key: KC_DB_PASSWORD}}}
            - {name: OPENWORKFLOW_TENANT_IDS, value: {{ join "," $tenantIds | quote }}}
{{- end }}
