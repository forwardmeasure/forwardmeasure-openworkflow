namespace: forwardmeasure-openworkflow
imagePullPolicy: IfNotPresent
# docker.io/forwardmeasure (images.tenantProvisioning) is a private org, not
# a public one - see openworkflow-service/values.yaml's identical comment.
# postgresql/cassandra/redpanda/curl are all public and don't need this, but
# a single imagePullSecrets on the pod covers every container regardless.
imagePullSecrets: [{name: docker-io-credentials}]
images:
  postgresql: {repository: postgres, tag: "18.0", digest: ""}
  cassandra: {repository: cassandra, tag: "5.0", digest: ""}
  redpanda: {repository: docker.redpanda.com/redpandadata/redpanda, tag: "v25.1.9", digest: ""}
  tenantProvisioning: {repository: forwardmeasure/openworkflow-tenant-provisioning, tag: "1.0.0-SNAPSHOT", digest: ""}
  curl: {repository: curlimages/curl, tag: "8.16.0", digest: ""}
keycloak:
  realm: forwardmeasure
  sharedClientId: forwardmeasure-public
  adminUsername: admin
  adminPassword: openworkflow-k1-admin
  clientSecret: openworkflow-k1-client
database:
  name: openworkflow
  username: openworkflow
  password: openworkflow-k1-database
  url: jdbc:postgresql://postgresql:5432/openworkflow
postgresql:
  enabled: true
cassandra:
  enabled: true
redpanda:
  enabled: true
secrets:
  create: true
  name: openworkflow-foundation
identityCredentialsSecretName: openworkflow-identity-credentials
jobs:
  tenantReconciliation:
    enabled: true
    keycloakUrl: http://keycloak.keycloak.svc.cluster.local:8080
capabilityPacks:
  - openworkflow
tenants:
  - id: 11111111-1111-1111-1111-111111111111
    alias: tenant-a
    displayName: Tenant A
  - id: 22222222-2222-2222-2222-222222222222
    alias: tenant-b
    displayName: Tenant B
