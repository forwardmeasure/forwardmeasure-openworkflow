namespace: forwardmeasure-openworkflow
imagePullPolicy: IfNotPresent
versions:
  keycloak: "26.7.1"
  postgres: "18.0"
  cassandra: "5.0"
  redpanda: "v25.1.9"
  tenantProvisioning: "1.0.0-SNAPSHOT"
  migrations: "1.0.0-SNAPSHOT"
keycloak:
  enabled: true
  realm: openworkflow
  sharedClientUuid: 00000000-0000-0000-0000-000000000001
  adminUsername: admin
  adminPassword: openworkflow-k1-admin
  clientSecret: openworkflow-k1-client
database:
  name: openworkflow
  username: openworkflow
  password: openworkflow-k1-database
  url: jdbc:postgresql://postgresql:5432/openworkflow
postgresql:
  enabled: true
cassandra:
  enabled: true
redpanda:
  enabled: true
secrets:
  create: true
  name: openworkflow-foundation
jobs:
  tenantReconciliation:
    enabled: true
    keycloakUrl: http://keycloak:8080
  migrations:
    enabled: true
capabilityPacks:
  - openworkflow
tenants:
  - id: 11111111-1111-1111-1111-111111111111
    alias: tenant-a
    displayName: Tenant A
  - id: 22222222-2222-2222-2222-222222222222
    alias: tenant-b
    displayName: Tenant B
