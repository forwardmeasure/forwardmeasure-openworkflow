# Cloud-wide GCP layer: safe, inert defaults for values every GCP cluster
# needs, so a cluster leaf file that forgets to override cloudSqlProxy/
# identity.serviceAccounts doesn't hit an undefined dig fallback instead it
# just renders as disabled. Real per-cluster values (project ID, GSA emails,
# Cloud SQL instance name) come from the cluster leaf file layered on top of
# this one (e.g. gcp-openworkflow-prod.yaml.gotmpl). Plain YAML, not
# .gotmpl - nothing here needs templating.
cloudProvider: gcp

cloudSqlProxy:
  enabled: false
  instanceConnectionName: placeholder-project:placeholder-region:placeholder-instance

identity:
  serviceAccounts:
    - name: openworkflow-runtime
      gcpServiceAccountEmail: placeholder-openworkflow-runtime@placeholder-project.iam.gserviceaccount.com
    - name: openworkflow-database-migration
      gcpServiceAccountEmail: placeholder-openworkflow-database-migration@placeholder-project.iam.gserviceaccount.com
