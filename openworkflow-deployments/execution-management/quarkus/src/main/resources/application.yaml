quarkus:
  application: {name: openworkflow-execution-management-quarkus}
  http: {host: 0.0.0.0}
  oidc:
    auth-server-url: "${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}"
    client-id: forwardmeasure-openworkflow
    credentials:
      secret: "${OPENWORKFLOW_CLIENT_SECRET}"
  datasource:
    db-kind: postgresql
    jdbc: {url: "${OPENWORKFLOW_DATABASE_URL:jdbc:postgresql://localhost:5432/openworkflow}"}
    username: "${OPENWORKFLOW_DATABASE_USERNAME:openworkflow}"
    password: "${OPENWORKFLOW_DATABASE_PASSWORD:openworkflow}"
openworkflow:
  engines:
    default: "${OPENWORKFLOW_DEFAULT_ENGINE:kafka-streams}"
    timeout: 30S
    kafka-streams:
      url: "${OPENWORKFLOW_KAFKA_ENGINE_URL:http://openworkflow-engine-kafka-streams-quarkus:8080/internal/v1/engine/}"
    pekko:
      url: "${OPENWORKFLOW_PEKKO_ENGINE_URL:http://openworkflow-engine-pekko-quarkus:8080/internal/v1/engine/}"
  authorization:
    issuer: "${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}"
    client-id: forwardmeasure-openworkflow
    client-secret: "${OPENWORKFLOW_CLIENT_SECRET}"
    request-timeout: 5S
    decision-ttl: 5S
    maximum-cache-entries: 10000
    policy-version: v1
