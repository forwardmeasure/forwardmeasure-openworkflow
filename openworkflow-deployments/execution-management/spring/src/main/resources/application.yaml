spring:
  application: {name: openworkflow-execution-management-spring}
  datasource:
    url: "${OPENWORKFLOW_DATABASE_URL:jdbc:postgresql://localhost:5432/openworkflow}"
    username: "${OPENWORKFLOW_DATABASE_USERNAME:openworkflow}"
    password: "${OPENWORKFLOW_DATABASE_PASSWORD:openworkflow}"
  jpa: {open-in-view: false, hibernate: {ddl-auto: none}}
server: {address: 0.0.0.0, shutdown: graceful}
openworkflow:
  engines:
    default: "${OPENWORKFLOW_DEFAULT_ENGINE:kafka-streams}"
    timeout: 30s
    kafka-streams:
      url: "${OPENWORKFLOW_KAFKA_ENGINE_URL:http://openworkflow-engine-kafka-streams-spring:8080/internal/v1/engine/}"
    pekko:
      url: "${OPENWORKFLOW_PEKKO_ENGINE_URL:http://openworkflow-engine-pekko-spring:8080/internal/v1/engine/}"
  authorization:
    issuer: "${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}"
    client-id: forwardmeasure-openworkflow
    client-secret: "${OPENWORKFLOW_CLIENT_SECRET}"
    request-timeout: 5s
    decision-ttl: 5s
    maximum-cache-entries: 10000
    policy-version: v1
