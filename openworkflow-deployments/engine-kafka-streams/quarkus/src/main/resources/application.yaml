quarkus:
  application: {name: openworkflow-engine-kafka-streams-quarkus}
  http: {host: 0.0.0.0}
  # openworkflow-quarkus-binding is only needed here for ActiveOrganizationProvider/
  # AuthorizationService (JWT/HTTP-based, no JPA at all - see QuarkusActiveOrganizationProvider),
  # but it transitively pulls forwardmeasure-jpa-quarkus + quarkus-hibernate-orm. This engine
  # configures no datasource, so Quarkus's build-time Hibernate ORM processor would otherwise hard
  # fail on the Actor entity it finds on the classpath ("Datasource '<default>' is not configured").
  hibernate-orm:
    enabled: false
  oidc:
    auth-server-url: "${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}"
    client-id: "${OPENWORKFLOW_CLIENT_ID:openworkflow}"
    credentials:
      secret: "${OPENWORKFLOW_CLIENT_SECRET}"
openworkflow:
  execution-events: {url: "${OPENWORKFLOW_EXECUTION_EVENTS_URL:http://openworkflow-execution-management-quarkus:8080/internal/v1/execution-events/}", timeout: 30S}
  kafka:
    bootstrap-servers: "${OPENWORKFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    application-id: "${OPENWORKFLOW_KAFKA_APPLICATION_ID:openworkflow-kafka}"
    instance-id: "${OPENWORKFLOW_KAFKA_INSTANCE_ID:${HOSTNAME:local}}"
    topic-prefix: "${OPENWORKFLOW_KAFKA_TOPIC_PREFIX:openworkflow}"
    state-dir: "${OPENWORKFLOW_KAFKA_STATE_DIR:/tmp/openworkflow-kafka}"
  authorization:
    issuer: "${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}"
    client-id: "${OPENWORKFLOW_CLIENT_ID:openworkflow}"
    client-secret: "${OPENWORKFLOW_CLIENT_SECRET}"
    # Not the same client as client-id above (this service's own AuthZEN
    # OAuth identity) - this is which client's roles to read out of an
    # INCOMING CloudEvent-routing request's JWT organization claim. Must
    # match the client the public/browser OIDC client (forwardmeasure-public)
    # role mappings actually live on.
    organization-client-id: "${OPENWORKFLOW_ORGANIZATION_CLIENT_ID:forwardmeasure-public}"
    request-timeout: 5S
    decision-ttl: 5S
    maximum-cache-entries: 10000
    policy-version: v1
