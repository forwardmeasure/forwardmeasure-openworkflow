micronaut: {application: {name: openworkflow-engine-pekko-micronaut}, server: {port: 8080}}
openworkflow:
  execution-events: {url: "${OPENWORKFLOW_EXECUTION_EVENTS_URL:http://openworkflow-execution-management-micronaut:8080/internal/v1/execution-events/}", timeout: 30s}
  # publish-url is deliberately absent here (no safe default - guessing it wrong would silently
  # misroute events; set OPENWORKFLOW_CLOUD_EVENTS_PUBLISH_URL directly when transport=http).
  cloud-events: {transport: "${OPENWORKFLOW_CLOUD_EVENTS_TRANSPORT:http}", timeout: "${OPENWORKFLOW_CLOUD_EVENTS_TIMEOUT:30s}"}
  kafka: {bootstrap-servers: "${OPENWORKFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}", topic-prefix: "${OPENWORKFLOW_KAFKA_TOPIC_PREFIX:openworkflow}"}
  eventing: {consumer-group: "${OPENWORKFLOW_EVENTING_CONSUMER_GROUP:openworkflow-pekko-cloud-events}", instance-id: "${OPENWORKFLOW_EVENTING_INSTANCE_ID:${HOSTNAME:local}}"}
  persistence: {profile: "${OPENWORKFLOW_PERSISTENCE_PROFILE:postgresql}", endpoint: "${OPENWORKFLOW_PERSISTENCE_ENDPOINT:jdbc:postgresql://postgresql:5432/openworkflow}", username: "${OPENWORKFLOW_PERSISTENCE_USERNAME:openworkflow}", password: "${OPENWORKFLOW_PERSISTENCE_PASSWORD:openworkflow}", local-datacenter: "${OPENWORKFLOW_PERSISTENCE_LOCAL_DATACENTER:datacenter1}"}
  pekko: {system-name: "${OPENWORKFLOW_PEKKO_SYSTEM_NAME:openworkflow-pekko}", ask-timeout: 10s}
  cluster: {discovery-service: "${OPENWORKFLOW_CLUSTER_DISCOVERY_SERVICE:}", pod-ip: "${OPENWORKFLOW_CLUSTER_POD_IP:}", artery-port: 25520, management-port: 8558, required-contact-points: 1, role: workflow-engine}
  authorization:
    issuer: "${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}"
    client-id: "${OPENWORKFLOW_CLIENT_ID:openworkflow}"
    client-secret: "${OPENWORKFLOW_CLIENT_SECRET}"
    # Not the same client as client-id above (this service's own AuthZEN
    # OAuth identity) - this is which client's roles to read out of an
    # INCOMING CloudEvent-routing/subworkflow authorization check's JWT
    # organization claim. Must match the client the public/browser OIDC
    # client (forwardmeasure-public) role mappings actually live on.
    organization-client-id: "${OPENWORKFLOW_ORGANIZATION_CLIENT_ID:forwardmeasure-public}"
    request-timeout: 5s
    decision-ttl: 5s
    maximum-cache-entries: 10000
    policy-version: v1
