spring:
  application:
    name: openworkflow-definition-management-spring
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  datasource:
    url: ${OPENWORKFLOW_DATABASE_URL:jdbc:postgresql://localhost:5432/openworkflow}
    username: ${OPENWORKFLOW_DATABASE_USERNAME:openworkflow}
    password: ${OPENWORKFLOW_DATABASE_PASSWORD:openworkflow}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}
server:
  address: 0.0.0.0
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
openworkflow:
  authorization:
    issuer: ${OPENWORKFLOW_KEYCLOAK_ISSUER:http://localhost:8080/realms/openworkflow}
    client-id: ${OPENWORKFLOW_CLIENT_ID:openworkflow}
    client-secret: ${OPENWORKFLOW_CLIENT_SECRET}
    # Not the same client as client-id above (this service's own AuthZEN
    # OAuth identity) - this is which client's roles to read out of an
    # INCOMING browser-issued JWT's organization claim. Must match the
    # client the public/browser OIDC client (forwardmeasure-public) role
    # mappings actually live on.
    organization-client-id: ${OPENWORKFLOW_ORGANIZATION_CLIENT_ID:forwardmeasure-public}
    request-timeout: 5s
    decision-ttl: 5s
    maximum-cache-entries: 10000
    policy-version: v1
