micronaut:
  application:
    name: openworkflow-micronaut-service
  server:
    host: 0.0.0.0
  security:
    enabled: true
    authentication: bearer
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${OPENWORKFLOW_KEYCLOAK_ISSUER:`http://localhost:8080/realms/openworkflow`}/protocol/openid-connect/certs
datasources:
  default:
    url: ${OPENWORKFLOW_DATABASE_URL:`jdbc:postgresql://localhost:5432/openworkflow`}
    username: ${OPENWORKFLOW_DATABASE_USERNAME:openworkflow}
    password: ${OPENWORKFLOW_DATABASE_PASSWORD:openworkflow}
    driver-class-name: org.postgresql.Driver
jpa:
  default:
    mapping-resources:
      - META-INF/openworkflow-orm.xml
    packages-to-scan:
      - com.forwardmeasure.jpa.identity.entity
      - com.forwardmeasure.openworkflow.definition.persistence
    properties:
      hibernate:
        hbm2ddl:
          auto: none
    entity-scan:
      enabled: true
      packages:
        - com.forwardmeasure.jpa.identity.entity
        - com.forwardmeasure.openworkflow.definition.persistence
openworkflow:
  engine:
    profile: ${OPENWORKFLOW_ENGINE_PROFILE:kafka-streams}
  kafka:
    bootstrap-servers: ${OPENWORKFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    application-id: ${OPENWORKFLOW_KAFKA_APPLICATION_ID:openworkflow-kafka}
    instance-id: ${OPENWORKFLOW_KAFKA_INSTANCE_ID:${HOSTNAME:local}}
    topic-prefix: ${OPENWORKFLOW_KAFKA_TOPIC_PREFIX:openworkflow}
    state-dir: ${OPENWORKFLOW_KAFKA_STATE_DIR:/tmp/openworkflow-kafka}
  adapters:
    consumer-group: ${OPENWORKFLOW_ADAPTER_CONSUMER_GROUP:openworkflow-kafka-operations}
    secret-directory: ${OPENWORKFLOW_ADAPTER_SECRET_DIRECTORY:/var/run/secrets/openworkflow}
    http-egress-allowlist: ${OPENWORKFLOW_ADAPTER_HTTP_EGRESS_ALLOWLIST:}
  authorization:
    issuer: ${OPENWORKFLOW_KEYCLOAK_ISSUER:`http://localhost:8080/realms/openworkflow`}
    client-id: forwardmeasure-openworkflow
    client-secret: ${OPENWORKFLOW_CLIENT_SECRET}
    request-timeout: 5s
    decision-ttl: 5s
    maximum-cache-entries: 10000
    policy-version: v1
