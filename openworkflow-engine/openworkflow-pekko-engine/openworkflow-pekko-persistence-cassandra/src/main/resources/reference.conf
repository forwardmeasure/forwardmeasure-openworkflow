openworkflow.persistence.profiles.cassandra {
  pekko.persistence {
    journal.plugin = "pekko.persistence.cassandra.journal"
    snapshot-store.plugin = "pekko.persistence.cassandra.snapshot"
  }
  pekko.persistence.cassandra {
    journal {
      keyspace = "openworkflow_journal"
      keyspace-autocreate = false
      tables-autocreate = false
    }
    snapshot {
      keyspace = "openworkflow_snapshot"
      keyspace-autocreate = false
      tables-autocreate = false
    }
    events-by-tag {
      # This project cannot contain journal data older than its initial persistence
      # epoch. Overriding Pekko's 2015 default avoids scanning about 94,000 empty
      # hourly buckets whenever a projection has no stored offset.
      first-time-bucket = "20260801T00:00"
    }
  }
  pekko.projection.cassandra.offset-store.keyspace = "openworkflow_projection"
  datastax-java-driver {
    basic {
      contact-points = [${?OPENWORKFLOW_CASSANDRA_CONTACT_POINT}]
      load-balancing-policy.local-datacenter = ${?OPENWORKFLOW_CASSANDRA_LOCAL_DATACENTER}
    }
    advanced.reconnect-on-init = true
  }
}
