pekko.actor {
  serializers {
    openworkflow-wire = "com.forwardmeasure.openworkflow.actor.serialization.OpenWorkflowWireSerializer"
  }
  serialization-bindings {
    "com.forwardmeasure.openworkflow.actor.WorkflowCommand" = openworkflow-wire
    "com.forwardmeasure.openworkflow.engine.api.EngineEvent" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.WorkflowReply" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.WorkflowState" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.ScheduleCommand" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.ScheduleEvent" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.ScheduleReply" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.ScheduleState" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.ScheduledExecutionRequest" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.SubworkflowCoordinatorCommand" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.SubworkflowCoordinatorEvent" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.SubworkflowCoordinatorReply" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.SubworkflowCoordinatorState" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.ProtocolOperationCoordinatorCommand" = openworkflow-wire
    "com.forwardmeasure.openworkflow.actor.ProtocolOperationCoordinatorReply" = openworkflow-wire
  }
}

pekko.serialization.jackson.allowed-class-prefix = [
  "com.forwardmeasure.openworkflow."
]

# Domain entities must apply backpressure instead of retaining an unbounded
# command backlog during a hot-tenant or dependency outage. A zero push timeout
# sends overflow to dead letters, causing bounded API asks to fail visibly.
openworkflow.entity-mailbox {
  mailbox-type = "org.apache.pekko.dispatch.BoundedMailbox"
  mailbox-capacity = 10000
  mailbox-push-timeout-time = 0s
}
