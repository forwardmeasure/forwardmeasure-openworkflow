openworkflow.persistence.profiles.postgresql {
  pekko.persistence {
    journal.plugin = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
  }
  pekko-persistence-jdbc.shared-databases.openworkflow {
    profile = "slick.jdbc.PostgresProfile$"
    db {
      connectionPool = "HikariCP"
      driver = "org.postgresql.Driver"
      url = ${?OPENWORKFLOW_POSTGRES_URL}
      user = ${?OPENWORKFLOW_POSTGRES_USER}
      password = ${?OPENWORKFLOW_POSTGRES_PASSWORD}
      numThreads = 8
      numThreads = ${?OPENWORKFLOW_POSTGRES_PERSISTENCE_POOL_MAXIMUM_SIZE}
      maxConnections = 8
      maxConnections = ${?OPENWORKFLOW_POSTGRES_PERSISTENCE_POOL_MAXIMUM_SIZE}
      minConnections = 2
    }
  }
  jdbc-journal.use-shared-db = "openworkflow"
  jdbc-snapshot-store.use-shared-db = "openworkflow"
  jdbc-read-journal.use-shared-db = "openworkflow"
  jdbc-durable-state-store.use-shared-db = "openworkflow"
  pekko.projection.jdbc {
    dialect = "postgres-dialect"
    blocking-jdbc-dispatcher.thread-pool-executor.fixed-pool-size = 20
  }
}
